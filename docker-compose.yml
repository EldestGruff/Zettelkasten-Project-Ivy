# ~/zettelkasten-project/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: zettelkasten-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${TZ}
    volumes:
      # Use Docker named volumes for persistence on Ivy's filesystem
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Map the port defined in .env (default 5432) ONLY to localhost on Ivy
      # Allows direct connection from tools on Ivy if needed, but not the wider network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - zettelkasten_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: # Optional: Configure logging driver and limits
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zettelkasten-qdrant
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # QDRANT__LOG_LEVEL: DEBUG # Uncomment for more detailed logs if needed
    volumes:
      # Use Docker named volumes for persistence on Ivy's filesystem
      - qdrant_data:/qdrant/storage
    ports:
      # Map Qdrant's REST API port ONLY to localhost on Ivy
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      # - "127.0.0.1:6334:6334" # gRPC port if needed
    networks:
      - zettelkasten_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama: # --- NEW OLLAMA SERVICE ---
    image: ollama/ollama:latest
    container_name: zettelkasten-ollama
    ports:
      # Map Ollama's default port to localhost on Ivy
      - "127.0.0.1:11434:11434"
    volumes:
      # Mount a volume to persist downloaded models
      - ollama_data:/root/.ollama
    # --- GPU Passthrough Configuration ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Or "all" if you want to guarantee all GPUs
              capabilities: [gpu] # Request GPU capabilities
    # --- End GPU Passthrough ---
    pull_policy: always # Ensure we get latest ollama image on start/recreate
    restart: unless-stopped
    networks:
      - zettelkasten_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5" # Keep more logs for Ollama

# --- NEW Backend Service ---
  backend:
    container_name: zettelkasten-backend
    # Build the image using the Dockerfile in the ./backend directory
    build:
      context: ./backend # Specifies the directory containing the Dockerfile
      dockerfile: Dockerfile # Explicitly state the Dockerfile name
    restart: unless-stopped
    env_file: .env # Load base environment variables from .env file
    environment:
      # --- Override specific variables for container networking ---
      # Use service names, not localhost/127.0.0.1 inside the container network
      POSTGRES_SERVER: postgres # Connect to the postgres service name
      # POSTGRES_PORT: 5432 # Default, usually not needed to override
      QDRANT_HOST: qdrant # Connect to the qdrant service name
      # QDRANT_PORT: 6333 # Default, usually not needed to override
      OLLAMA_API_BASE_URL: http://ollama:11434 # Connect to ollama service name
      # Optional: Set Python path if needed within container, though WORKDIR /app should handle it
      # PYTHONPATH: /app
      # Ensure TZ is passed from .env if defined there
      TZ: ${TZ:-Etc/UTC}
      # Note: DATABASE_URL is computed internally by the Settings class based on the above variables
    ports:
      # Map port 8000 inside the container to port 8000 on the Ivy host
      # Use 0.0.0.0 to allow access from other machines (like Toottoot)
      - "8000:8000"
      # If only access from Ivy itself was needed:
      # - "127.0.0.1:8000:8000"
    volumes: [] # Specifies no volumes for this service
    depends_on:
      # Define service dependencies for startup order
      postgres:
        condition: service_healthy # Wait for postgres healthcheck to pass
      qdrant:
        condition: service_started # Wait for qdrant to start (no easy healthcheck command)
      ollama:
        condition: service_started # Wait for ollama to start
    networks:
      - zettelkasten_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # --- End Backend Service ---

volumes:
  postgres_data:
  qdrant_data:
  ollama_data: # --- Add volume definition for Ollama ---

networks:
  zettelkasten_net:
    driver: bridge
