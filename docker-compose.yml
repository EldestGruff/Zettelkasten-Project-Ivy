# ~/zettelkasten-project/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: zettelkasten-postgres # Changed from zettelkasten-postgres-1 for consistency
    restart: unless-stopped
    env_file: .env # Load .env from project root
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Etc/UTC}
      PGTZ: ${TZ:-Etc/UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" # Map to host's localhost
    networks:
      - zettelkasten_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: zettelkasten-qdrant # Changed from zettelkasten-qdrant-1
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333" # Map to host's localhost
    networks:
      - zettelkasten_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama service is removed as it's running natively on the host

  backend:
    container_name: zettelkasten-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env # Load .env from project root
    environment:
      # For connections from backend container to other services:
      POSTGRES_SERVER: postgres         # Service name for Postgres
      QDRANT_HOST: qdrant             # Service name for Qdrant
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      # --- For backend container to connect to NATIVE Ollama on HOST ---
      OLLAMA_API_BASE_URL: http://host.docker.internal:11434
      # POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_DB: ${POSTGRES_DB}
      
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      CATEGORIZATION_MODEL_NAME: ${CATEGORIZATION_MODEL_NAME}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}
      TZ: ${TZ:-Etc/UTC}
    ports:
      # Map backend's port 8000 to host's port 8000 (accessible via localhost:8000 on Mac)
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      # No dependency on Ollama service as it's external now
    networks:
      - zettelkasten_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  qdrant_data:
  # ollama_data: # Not needed if Ollama is native

networks:
  zettelkasten_net:
    driver: bridge
